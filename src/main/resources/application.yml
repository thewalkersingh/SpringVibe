spring:
  application:
    name: springvibe

  ### H2 Config
  datasource:
    url: jdbc:h2:mem:springvibe
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Use create-drop for tests/development so schema (with identity columns)
      # is created fresh and Hibernate can run import.sql properly.
      ddl-auto: update
    show-sql: false
    # Ensure Hibernate creates the schema before Spring runs schema.sql
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      # Disable Spring's schema.sql initialization (we'll use Hibernate's import.sql)
      mode: never # or never

  # security config
  security:
    user:
      name: root
      password: admin

logging:
  level:
    org-springframework-jdbc: DEBUG